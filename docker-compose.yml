services:

  # ==========================================
  # MONGODB
  # ==========================================
  mongodb:
    image: mongo:7
    container_name: stir-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    environment:
      MONGO_INITDB_DATABASE: stirworkflow


  # ==========================================
  # PYTHON MODEL / FLASK
  # ==========================================
  model:
    build:
      context: ./projASSu
      dockerfile: Dockerfile

    container_name: stir-model
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      FLASK_ENV: production
      PORT: 5000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================
  # SPRING BOOT BACKEND
  # ==========================================
  backend:
    build:
      context: ./BackendStiirworkflow
      dockerfile: Dockerfile

    container_name: stir-backend
    restart: unless-stopped

    depends_on:
      - mongodb
      - model

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/stirworkflow

      JWT_SECRET: ${JWT_SECRET:-ChangeThisToALongRandomSecretKeyAtLeast32Characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      PYTHON_API_URL: http://model:5000

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"


  # ==========================================
  # REACT FRONTEND + NGINX
  # ==========================================
  frontend:
    build:
      context: ./stir-frontend
      dockerfile: Dockerfile

    container_name: stir-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"


# ==========================================
# VOLUMES
# ==========================================
volumes:
  mongo_data: