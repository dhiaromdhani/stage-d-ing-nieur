server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nécessaire pour React Router : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets buildés (hashés par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}