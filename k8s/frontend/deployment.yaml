apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stir
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: stiracr2026.azurecr.io/stir-frontend:latest
          ports: [{ containerPort: 80 }]